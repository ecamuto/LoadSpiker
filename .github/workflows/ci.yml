name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Build & test (pytest + TSan + ASan)
    runs-on: ubuntu-latest

    # Live backends so the real DB driver paths are exercised, not skipped.
    services:
      mariadb:
        image: mariadb:11
        env:
          MARIADB_DATABASE: testdb
          MARIADB_USER: testuser
          MARIADB_PASSWORD: testpass
          MARIADB_ROOT_PASSWORD: testpass
        ports:
          - 3306:3306
        options: >-
          --health-cmd="healthcheck.sh --connect --innodb_initialized"
          --health-interval=5s --health-timeout=5s --health-retries=10
      mongodb:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd="mongosh --quiet --eval 'db.runCommand({ping:1}).ok'"
          --health-interval=5s --health-timeout=5s --health-retries=10

    env:
      LOADSPIKER_TEST_MYSQL: "mysql://testuser:testpass@127.0.0.1:3306/testdb"
      LOADSPIKER_TEST_MONGO: "mongodb://127.0.0.1:27017/testdb"

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libpq-dev pkg-config \
            default-libmysqlclient-dev libmongoc-dev libbson-dev

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build extension in place
        run: python setup.py build_ext --inplace

      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest tests/ -v

      # ThreadSanitizer stress check over the protocol connection pools.
      - name: ThreadSanitizer
        run: make tsan

      # AddressSanitizer harness over the MQTT packet encoders (V1-V3) and
      # protocol I/O paths. Standalone instrumented binary — see tests/asan_check.c.
      - name: AddressSanitizer
        run: make test-asan
