name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: Build & test (pytest + TSan + ASan)
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libcurl4-openssl-dev libpq-dev pkg-config

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Build extension in place
        run: python setup.py build_ext --inplace

      - name: Run tests
        env:
          PYTHONPATH: ${{ github.workspace }}
        run: python -m pytest tests/ -v

      # ThreadSanitizer stress check over the protocol connection pools.
      - name: ThreadSanitizer
        run: make tsan

      # AddressSanitizer harness over the MQTT packet encoders (V1-V3) and
      # protocol I/O paths. Standalone instrumented binary — see tests/asan_check.c.
      - name: AddressSanitizer
        run: make test-asan
